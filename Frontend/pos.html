<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point of Sale</title>
    <!-- Assuming you combined the CSS into one file, or you can link both -->
    <link rel="stylesheet" href="pos_style.css"> 
</head>

<body>
    
    <nav class="navbar">
        <div class="nav-left">
            <button class="dashboard" type="button" onclick="window.location.href='dashboard.html'">⟵ Back to Dashboard</button>
        </div>
        
        <div class="nav-center">
            <h1 class="nav-title">Apb merchandising</h1>
            <span class="nav-subtitle">Point of Sale</span>
        </div>

        <div class="nav-right">
            <span id="userInfo">Loading user...</span>
            &nbsp;|&nbsp;
            <button id="logoutButton" class="logout">Logout</button>
        </div>
    </nav>

    <!-- POS APPLICATION AREA -->
    <section class="app-container">
        
        <!-- LEFT: Product Catalog -->
        <div class="catalog-section">
            <header class="catalog-header">
                <label class="search-label" for="product-search">Search items</label>
                <input type="search" class="search-input" id="product-search" placeholder="Name or barcode...">
            </header>

            <div class="data-grid-wrapper">
                <table class="data-grid">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Barcode</th>
                            <th>Price</th>
                            <th>In stock</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="product-grid">
                        <tr><td colspan="5">Loading items...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- RIGHT: Cart Sidebar -->
        <aside class="cart-section">
            <div class="cart-header">
                <h2>Current Order</h2>
                <button class="clear-text-btn" id="clear-btn">Clear</button>
            </div>

            <div class="cart-items data-grid-wrapper">
                <table class="data-grid selected-grid">
                    <thead>
                        <tr>
                            <th>Selected item</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <tr><td colspan="4" class="empty-cart-msg">No items selected.</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="cart-footer">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₱0.00</span>
                </div>

                <div class="summary-row">
                    <span>Discount</span>
                    <span id="discount">₱0.00</span>
                </div>

                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="total">₱0.00</span>
                </div>

                <div class="payment-methods" id="payment-methods">
                    <button class="pay-btn bg-white" id="discount-btn" type="button">Discount</button>
                    <button class="pay-btn" id="cash-btn" type="button" data-method="Cash">Cash</button>
                    <button class="pay-btn" id="gcash-btn" type="button" data-method="GCash">GCash</button>
                </div>

                <button class="checkout-btn" id="checkout-btn" disabled>Checkout • ₱0.00</button>
            </div>
        </aside>

    </section>

    <dialog class="pos-dialog" id="discount-dialog">
        <form id="discount-form" method="dialog">
            <h2>Apply Discount</h2>
            <label for="discount-amount">Discount amount (₱)</label>
            <input id="discount-amount" type="number" min="0" step="0.01" required>
            <p class="dialog-error" id="discount-error" role="alert"></p>
            <div class="dialog-actions">
                <button class="dialog-cancel" type="submit" value="cancel">Cancel</button>
                <button class="dialog-confirm" type="submit" value="apply">Apply Discount</button>
            </div>
        </form>
    </dialog>

    <dialog class="pos-dialog" id="payment-dialog">
        <form id="payment-form" method="dialog">
            <h2 id="payment-dialog-title">Payment</h2>
            <label id="payment-input-label" for="payment-input"></label>
            <input id="payment-input" type="number" min="0" step="0.01" required>
            <p class="dialog-error" id="payment-error" role="alert"></p>
            <div class="dialog-actions">
                <button class="dialog-cancel" type="submit" value="cancel">Cancel</button>
                <button class="dialog-confirm" type="submit" value="confirm">Confirm Payment</button>
            </div>
        </form>
    </dialog>

    <script src="pos.js" defer></script>
    
</body>
</html>
