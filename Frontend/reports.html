<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="reports_style.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="table-sort.css">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <button class="dashboard" type="button" onclick="window.location.href='dashboard.html'">⟵ Back to Dashboard</button>
        </div>
        <div class="nav-center">
            <h1 class="nav-title">APB Merchandising</h1>
            <span class="nav-subtitle">Reports • Admin Access</span>
        </div>
        <div class="nav-right">
            <div class="nav-user-row">
                <span id="userInfo">Loading user...</span>
                <span aria-hidden="true">|</span>
                <button class="dashboard" type="button" onclick="window.location.reload()">⟳ Refresh</button>
                <span aria-hidden="true">|</span>
                <button id="logoutButton" class="logout" type="button">Logout</button>
            </div>
        </div>
    </nav>

    <div class="page-layout">
        <aside class="page-sidebar" aria-label="Page sections">
            <p class="page-sidebar-title">On this page</p>
            <a href="#reportFilterSection">Generate Report</a>
            <a href="#view-overview">Overview</a>
            <a href="#view-trend">Trend</a>
            <a href="#view-categories">Categories</a>
            <a href="#view-payments">Payments</a>
            <a href="#view-discounts">Discounts</a>
            <a href="#view-snapshot">Snapshot</a>
            <a href="#view-movements">Movements</a>
        </aside>
        <div class="page-main">
    <main class="reports-container" id="reportsPage" hidden>
        <p id="reportMessage" class="report-message" role="status" aria-live="polite"></p>
        <section class="filter-section" id="reportFilterSection">
            <h2>Generate Report</h2>
            <form class="filter-grid" id="reportForm">
                <div class="form-group">
                    <label for="reportCategory">Report Category</label>
                    <select id="reportCategory">
                        <option value="sales">Sales Report</option>
                        <option value="inventory">Inventory Report</option>
                    </select>
                </div>
                <div class="form-group" id="periodGroup">
                    <label for="salesPeriod">Sales Period</label>
                    <select id="salesPeriod">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
                <div class="form-group" id="dateGroup">
                    <label for="periodDate" id="periodDateLabel">Date</label>
                    <input type="date" id="periodDate" required>
                </div>
                <div class="form-group" id="paymentGroup">
                    <label for="paymentFilter">Payment</label>
                    <select id="paymentFilter">
                        <option value="">All methods</option>
                        <option value="Cash">Cash</option>
                        <option value="GCash">GCash</option>
                    </select>
                </div>
                <div class="form-group" id="inventoryCategoryGroup" hidden>
                    <label for="inventoryCategoryFilter">Category</label>
                    <select id="inventoryCategoryFilter">
                        <option value="">All categories</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-generate" id="generateReportButton">Generate Report</button>
                    <button type="button" class="btn-export" id="printReportButton" disabled>Print</button>
                </div>
            </form>
        </section>

        <div class="report-results" id="reportResults" hidden></div>
    </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="table-sort.js" defer></script>
    <script src="config.js" defer></script>
    <script src="sidebar.js" defer></script>
    <script src="reports.js" defer></script>
</body>
</html>
