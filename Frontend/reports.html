<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="reports_style.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="table-sort.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <button class="dashboard" type="button" onclick="window.location.href='dashboard.html'">⟵ Back to Dashboard</button>
        </div>
        <div class="nav-center">
            <h1 class="nav-title">APB Merchandising</h1>
            <span class="nav-subtitle">Reports • Admin Access</span>
        </div>
        <div class="nav-right">
            <div class="nav-user-row">
                <span id="userInfo">Loading user...</span>
                <span aria-hidden="true">|</span>
                <button id="logoutButton" class="logout" type="button">Logout</button>
            </div>
        </div>
    </nav>

    <main class="reports-container" id="reportsPage" hidden>
        <p id="reportMessage" class="report-message" role="status" aria-live="polite"></p>
        <section class="filter-section">
            <h2>Generate Report</h2>
            <form class="filter-grid" id="reportForm">
                <div class="form-group">
                    <label for="reportType">Report</label>
                    <select id="reportType">
                        <option value="sales">Sales Report</option>
                        <option value="inventory">Inventory Report</option>
                    </select>
                </div>
                <div class="form-group" id="periodGroup">
                    <label for="salesPeriod">Sales Period</label>
                    <select id="salesPeriod">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
                <div class="form-group" id="dateGroup">
                    <label for="periodDate" id="periodDateLabel">Date</label>
                    <input type="date" id="periodDate" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-generate" id="generateReportButton">Generate Report</button>
                    <button type="button" class="btn-export" id="exportReportButton" disabled>Export CSV</button>
                    <button type="button" class="btn-export" id="printReportButton" disabled>Print</button>
                </div>
            </form>
        </section>

        <section class="report-results" id="reportResults" hidden>
            <div class="report-heading">
                <div>
                    <h2 id="resultsTitle">Report Results</h2>
                    <p id="resultsPeriod"></p>
                </div>
                <p id="generatedAt"></p>
            </div>
            <section class="summary-section" id="summaryCards" aria-label="Report summary"></section>
            <section class="data-section">
                <h2 id="tableTitle">Details</h2>
                <div class="table-wrapper">
                    <table class="report-table">
                        <thead id="reportTableHead"></thead>
                        <tbody id="reportTableBody"></tbody>
                    </table>
                </div>
            </section>
            <section class="data-section" id="additionalReportSection" hidden>
                <h2 id="additionalTableTitle"></h2>
                <div class="table-wrapper">
                    <table class="report-table">
                        <thead id="additionalTableHead"></thead>
                        <tbody id="additionalTableBody"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
    <script src="table-sort.js" defer></script>
    <script src="reports.js" defer></script>
</body>
</html>
