<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APB Dashboard</title>
    <link rel="stylesheet" href="dashboard_style.css">
    <link rel="stylesheet" href="navigation.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="pictures/logo.png" alt="APB Logo" class="login-logo">
        </div>

        <div class="nav-center">
            <h1 class="nav-title">APB Merchandising</h1>
            <span class="nav-subtitle">Workspace</span>
        </div>

        <div class="nav-right">
            <div class="nav-user-row">
                <span id="userInfo">Loading user...</span>
                <span aria-hidden="true">|</span>
                <button class="dashboard" type="button" onclick="window.location.reload()">⟳ Refresh</button>
                <span aria-hidden="true">|</span>
                <button id="logoutButton" class="logout">Logout</button>
            </div>
            <button id="adminSettingsButton" class="admin-settings-btn" hidden>
                Admin Settings
            </button>
        </div>
    </nav>

    <main class="main-content">
        <section class="welcome-section">
            <h1 id="dashboardTitle">Dashboard</h1>
            <p>Welcome to APB Merchandising. Choose a workspace to get started.</p>
        </section>

        <section>          
            <div class="cards-wrapper">
                <!-- POS Button -->
                <button class="Btn" data-page="pos.html">
                    <div class="card-text">
                        <h2>POS</h2>
                        <p>Point of Sales</p>
                    </div>
                </button>

                <!-- Inventory Button -->
                <button class="Btn" data-page="inventory.html">
                    <div class="card-text">
                        <h2>Inventory</h2>
                        <p>View Inventory</p>
                    </div>
                </button>

                <!-- Reports Button -->
                <button class="Btn" id="reportsButton" data-page="reports.html" hidden>
                    <div class="card-text">
                        <h2>Reports</h2>
                        <p>Print/View Reports</p>
                    </div>
                </button>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 APB Merchandising. All rights reserved.</p>
    </footer>

    <script src="config.js" defer></script>
    <script src="dashboard.js" defer></script>
    
</body>
</html>
