<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APB Dashboard</title>
    <link rel="stylesheet" href="dashboard_style.css">
</head>
<body>


    <nav class="navbar">
        <div class="nav-left">
            <span class="nav-title">DASHBOARD</span>
        </div>

        <div class="nav-right">
            <span id="userInfo">Loading user...</span>
            &nbsp;|&nbsp;
            <button id="logoutButton" class="logout">Logout</button>

        </div>
    </nav>

    <main class="main-content">
        <div class="logo-container">
            <h1 class="main-logo">APB merchandising</h1>
        </div>

        <div class="cards-wrapper">
            <!-- POS Card Button -->
            <button class="Btn bg-blue" data-page="pos.html">
                <div class="card-text">
                    <h2>POS</h2>
                    <p>Point of Sales</p>
                </div>
            </button>

            <!-- Inventory Card Button -->
            <button class="Btn bg-red" data-page="inventory.html">
                <div class="card-text">
                    <h2>Inventory</h2>
                    <p>View Inventory</p>
                </div>
            </button>

            <!-- Reports Card Button -->
            <button class="Btn bg-green" data-page="reports.html">
                <div class="card-text">
                    <h2>Reports</h2>
                    <p>Print/View Reports</p>
                </div>
            </button>

        </div>
    </main>

    <script src="dashboard.js" defer></script>
    
</body>
</html>
