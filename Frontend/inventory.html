<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="inventory_style.css">
</head>

<body>

    <nav class="navbar">

        <div class="nav-left">
            <button class="dashboard" type="button" onclick="window.location.href='dashboard.html'">⟵ Back to Dashboard</button>
        </div>
        
        <div class="nav-center">
            <h1 class="nav-title">APB merchandising</h1>
            <span class="nav-subtitle">Inventory • Admin Access</span>
        </div>

        <div class="nav-right">
            <span id="userInfo">Loading user...</span>
            &nbsp;|&nbsp;
            <button id="logoutButton" class="logout">Logout</button>
            
        </div>
    </nav>
    
    <main class="inventory-container">
        <!-- Data Input Section -->
        <div class="input-section">
            <h2>Add New Stock Entry</h2>
            <form class="input-grid" action="#" method="POST">
                <div class="form-group">
                    <label for="itemCode">Item Code</label>
                    <input type="text" id="itemCode" name="itemCode" placeholder="e.g., ITM-001" required>
                </div>
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" name="itemName" placeholder="Enter product name" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="apparel">Apparel</option>
                        <option value="accessories">Accessories</option>
                        <option value="equipment">Equipment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Initial Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="0" value="0" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Add to Database</button>
                </div>
            </form>
        </div>

        <!-- Inventory Grid Section -->
        <div class="grid-section">
            <h2>Current Inventory Status</h2>
            <div class="table-responsive">
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>Item Code</th>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Current Stock</th>
                            <th>Actions (Stock In / Out)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Placeholder rows for your MongoDB data -->
                        <tr>
                            <td>ITM-001</td>
                            <td>Basic T-Shirt</td>
                            <td>Apparel</td>
                            <td>150</td>
                            <td class="action-cells">
                                <input type="number" class="action-input" placeholder="Qty" min="1">
                                <button class="btn-stockin" type="button">Stock In</button>
                                <button class="btn-stockout" type="button">Stock Out</button>
                            </td>
                        </tr>
                        <tr>
                            <td>ITM-002</td>
                            <td>Canvas Tote Bag</td>
                            <td>Accessories</td>
                            <td>45</td>
                            <td class="action-cells">
                                <input type="number" class="action-input" placeholder="Qty" min="1">
                                <button class="btn-stockin" type="button">Stock In</button>
                                <button class="btn-stockout" type="button">Stock Out</button>
                            </td>
                        </tr>
                        <tr>
                            <td>ITM-003</td>
                            <td>Display Rack</td>
                            <td>Equipment</td>
                            <td>12</td>
                            <td class="action-cells">
                                <input type="number" class="action-input" placeholder="Qty" min="1">
                                <button class="btn-stockin" type="button">Stock In</button>
                                <button class="btn-stockout" type="button">Stock Out</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
