<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point of Sale Inventory System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">
    <div class="card-content">

      <img src="pictures\logo.png" alt="APB Logo" class="login-logo">
      <br><br><br>

      <h1>Welcome Back!</h1>
   
      <p class="subtitle">Sign in to your account</p>

        <form id="loginForm">
          
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>

          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" required>
            <button
              type="button"
              id="togglePassword"
              class="password-visibility-toggle"
              aria-controls="password"
              aria-pressed="false"
            >Show</button>
          </div>

          <button type="submit">Login</button>
          <p id="message"></p>

        </form>

        <button type="button" id="showRecoveryForm" class="recovery-link">
          Forgot password?
        </button>
        <form id="recoveryForm" class="hidden">
          <h2>Reset your password</h2>
          <p class="subtitle">We will email a one-time code to the address bound to your account.</p>

          <label for="recoveryEmail">Bound email</label>
          <input type="email" id="recoveryEmail" autocomplete="email" required>

          <button type="submit" id="sendCodeButton">Send code</button>
          <p id="recoveryMessage" role="status" aria-live="polite"></p>

          <div id="resetCodeSection" hidden>
            <label for="recoveryCode">One-time code</label>
            <input type="text" id="recoveryCode" inputmode="numeric" pattern="[0-9]{6}"
              maxlength="6" autocomplete="one-time-code" required>

            <label for="newPassword">New password</label>
            <div class="password-input-wrapper">
              <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
              <button
                type="button"
                id="toggleNewPassword"
                class="password-visibility-toggle"
                aria-controls="newPassword"
                aria-pressed="false"
              >Show</button>
            </div>

            <label for="confirmNewPassword">Confirm new password</label>
            <div class="password-input-wrapper">
              <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="6" required>
              <button
                type="button"
                id="toggleConfirmNewPassword"
                class="password-visibility-toggle"
                aria-controls="confirmNewPassword"
                aria-pressed="false"
              >Show</button>
            </div>

            <button type="submit" id="resetPasswordButton">Reset password</button>
          </div>

          <button type="button" id="cancelRecovery" class="secondary-button">Back to login</button>
        </form>

    </div>
  </main>

    <script src="login.js"></script>

  </body>
</html>
