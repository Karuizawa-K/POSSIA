<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point of Sale Inventory System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">
    <div class="card-content">

      <img src="pictures\logo.png" alt="APB Logo" class="login-logo">
      <br><br><br>

      <h1>Welcome Back!</h1>
   
      <p class="subtitle">Sign in to your account</p>

        <form id="loginForm">
          
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>

          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" required>
            <button
              type="button"
              id="togglePassword"
              class="password-visibility-toggle"
              aria-controls="password"
              aria-pressed="false"
            >Show</button>
          </div>

          <button type="submit">Login</button>
          <p id="message"></p>

        </form>

        <button type="button" id="showRecoveryForm" class="recovery-link">
          Forgot owner password?
        </button>
        <form id="recoveryForm" class="hidden">
          <h2>Reset owner password</h2>
          <p class="subtitle">This recovery option is only for the designated owner account.</p>

          <label for="recoveryUsername">Owner username</label>
          <input type="text" id="recoveryUsername" autocomplete="username" required>

          <label for="recoveryCode">Owner password recovery code</label>
          <div class="password-input-wrapper">
            <input type="password" id="recoveryCode" autocomplete="off" minlength="32" maxlength="256" required>
            <button
              type="button"
              id="toggleRecoveryCode"
              class="password-visibility-toggle"
              aria-controls="recoveryCode"
              aria-pressed="false"
            >Show</button>
          </div>

          <label for="newPassword">New password</label>
          <div class="password-input-wrapper">
            <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
            <button
              type="button"
              id="toggleNewPassword"
              class="password-visibility-toggle"
              aria-controls="newPassword"
              aria-pressed="false"
            >Show</button>
          </div>

          <label for="confirmNewPassword">Confirm new password</label>
          <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="6" required>

          <button type="submit">Reset password</button>
          <p id="recoveryMessage" role="status" aria-live="polite"></p>
          <button type="button" id="cancelRecovery" class="secondary-button">Back to login</button>
        </form>

    </div>
  </main>

    <script src="login.js"></script>

  </body>
</html>
